services:
  #Nginx Service
  fintop_nginx:
    container_name: fintop_nginx
    image: nginx:alpine
    restart: unless-stopped
    volumes:
      - .:/var/www
      - ./docker/nginx:/etc/nginx/conf.d
      - ./storage/nginx/log:/var/log/nginx
    ports:
      - "8687:80"
    depends_on:
      - fintop_php
  #Php Service
  fintop_php:
    container_name: fintop_php
    build:
      context: ./docker/php
      dockerfile: ./Dockerfile
    restart: unless-stopped
    volumes:
      - .:/var/www
    working_dir: /var/www
    extra_hosts:
    - "host.docker.internal:host-gateway"